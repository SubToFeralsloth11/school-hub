<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="Notes, reminders, school tracker and email tracker">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="School Hub">
  <title>School Hub</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <nav class="nav" aria-label="Sections">
      <div class="brand"><img src="icon.svg" alt="" width="28" height="28"><span>School Hub</span></div>
      <a href="#today" data-view="today"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Today</span></a>
      <a href="#notes" data-view="notes"><svg viewBox="0 0 24 24"><path d="M6 3h9l5 5v13H6zM14 3v6h6M9 13h8M9 17h6"/></svg><span>Notes</span></a>
      <a href="#reminders" data-view="reminders"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 21h4"/></svg><span>Reminders</span></a>
      <a href="#school" data-view="school"><svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5zM6 11v5c3 3 9 3 12 0v-5"/></svg><span>School</span></a>
      <a href="#email" data-view="email"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zM3 6l9 7 9-7"/></svg><span>Email</span><b class="badge" id="email-badge" hidden></b></a>
      <a href="#settings" data-view="settings"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3.1 14H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></a>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>

  <dialog id="modal">
    <form id="modal-form" method="dialog" novalidate>
      <header class="modal-head">
        <h2 id="modal-title"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">✕</button>
      </header>
      <div class="modal-body" id="modal-body"></div>
      <footer class="modal-foot">
        <button type="button" class="btn danger" id="modal-delete" hidden>Delete</button>
        <span class="grow"></span>
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary" id="modal-save">Save</button>
      </footer>
    </form>
  </dialog>

  <div id="toasts" aria-live="polite"></div>
  <div id="drop-hint" hidden>Drop .eml files to track them</div>

  <noscript><p class="noscript">School Hub needs JavaScript turned on.</p></noscript>
  <script src="js/core.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
